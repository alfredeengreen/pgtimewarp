[package]
name = "pgtimewarp-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-postgres = "0.7"
tokio-stream = "0.1"
postgres = "0.19"
postgres-openssl = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
figment = { version = "0.10", features = ["yaml", "env"] }
bytes = "1.5"
xxhash-rust = { version = "0.3", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
