name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-agent:
    name: Test Agent
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: agent/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build agent
      working-directory: ./agent
      run: cargo build --verbose
    
    - name: Check agent
      working-directory: ./agent
      run: cargo check --verbose
    
    - name: Run agent tests
      working-directory: ./agent
      run: cargo test --verbose

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: cli/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build CLI
      working-directory: ./cli
      run: cargo build --verbose
    
    - name: Check CLI
      working-directory: ./cli
      run: cargo check --verbose
    
    - name: Run CLI tests
      working-directory: ./cli
      run: cargo test --verbose

  test-extension:
    name: Test Extension
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install PostgreSQL development headers
      run: |
        sudo apt-get update
        sudo apt-get install -y wget ca-certificates lsb-release
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        # Remove any existing PostgreSQL 16 packages that might conflict
        sudo apt-get remove -y postgresql-server-dev-16 postgresql-16 2>/dev/null || true
        sudo apt-get install -y postgresql-server-dev-15 postgresql-15
        # Find and set pg_config for PostgreSQL 15
        PG15_CONFIG=$(find /usr -name pg_config -path "*/postgresql/15/*" 2>/dev/null | head -1)
        if [ -z "$PG15_CONFIG" ]; then
          # Try alternative location
          PG15_CONFIG="/usr/lib/postgresql/15/bin/pg_config"
        fi
        if [ -f "$PG15_CONFIG" ]; then
          sudo update-alternatives --install /usr/bin/pg_config pg_config "$PG15_CONFIG" 100 || true
          sudo update-alternatives --set pg_config "$PG15_CONFIG" || true
        fi
        # Verify pg_config points to correct version
        echo "pg_config location: $(which pg_config)"
        echo "pg_config version: $(pg_config --version)"
        echo "pg_config includes: $(pg_config --includedir-server)"
    
    - name: Build extension
      working-directory: ./ext
      run: |
        # Explicitly use PostgreSQL 15 pg_config
        PG15_CONFIG=$(find /usr -name pg_config -path "*/postgresql/15/*" 2>/dev/null | head -1 || echo "/usr/lib/postgresql/15/bin/pg_config")
        if [ -f "$PG15_CONFIG" ]; then
          make PG_CONFIG="$PG15_CONFIG"
        else
          make
        fi
    
    - name: Install extension in container
      run: |
        # Find the PostgreSQL container (GitHub Actions service)
        CONTAINER_ID=$(docker ps -q -f ancestor=postgres:15 | head -1)
        if [ -z "$CONTAINER_ID" ]; then
          echo "PostgreSQL container not found"
          docker ps -a
          exit 1
        fi
        echo "Found PostgreSQL container: $CONTAINER_ID"
        # Verify source files exist
        echo "Checking source files:"
        ls -la ext/pgtimewarp.control || { echo "Control file not found"; exit 1; }
        ls -la ext/sql/pgtimewarp--0.1.sql || { echo "SQL file not found"; exit 1; }
        # Check PostgreSQL version in container
        echo "PostgreSQL version in container:"
        docker exec $CONTAINER_ID psql --version || echo "Could not get version"
        # Determine PostgreSQL version and paths
        PG_VERSION=$(docker exec $CONTAINER_ID psql -U postgres -tAc "SHOW server_version_num" 2>/dev/null | head -c 2 || echo "15")
        echo "Detected PostgreSQL version: $PG_VERSION"
        EXT_DIR="/usr/share/postgresql/$PG_VERSION/extension"
        LIB_DIR="/usr/lib/postgresql/$PG_VERSION/lib"
        # Create directories in container
        docker exec $CONTAINER_ID mkdir -p $EXT_DIR
        docker exec $CONTAINER_ID mkdir -p $LIB_DIR
        # Copy extension files into the PostgreSQL container
        echo "Copying control file..."
        docker cp ext/pgtimewarp.control $CONTAINER_ID:$EXT_DIR/ || { echo "Failed to copy control file"; exit 1; }
        echo "Copying SQL file..."
        docker cp ext/sql/pgtimewarp--0.1.sql $CONTAINER_ID:$EXT_DIR/ || { echo "Failed to copy SQL file"; exit 1; }
        # Copy the compiled shared library if it exists
        if [ -f ext/pgtimewarp.so ]; then
          echo "Copying shared library..."
          docker cp ext/pgtimewarp.so $CONTAINER_ID:$LIB_DIR/ || echo "Failed to copy shared library"
        else
          echo "Shared library not found, extension may be SQL-only"
        fi
        # Verify files were copied
        echo "Files in container extension directory:"
        docker exec $CONTAINER_ID ls -la $EXT_DIR/ | grep pgtimewarp || { echo "No pgtimewarp files found"; exit 1; }
    
    - name: Test SQL migrations
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pgtimewarp_test;"
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -f store/migrations/001_init.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -f store/migrations/002_indexes.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -f store/migrations/003_roles_grants.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -f store/migrations/004_retention.sql
    
    - name: Test extension creation
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -c "CREATE EXTENSION pgtimewarp;"
        PGPASSWORD=postgres psql -h localhost -U postgres -d pgtimewarp_test -c "SELECT * FROM pg_extension WHERE extname = 'pgtimewarp';"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true
    
    - name: Run rustfmt
      run: |
        cargo fmt --manifest-path agent/Cargo.toml -- --check
        cargo fmt --manifest-path cli/Cargo.toml -- --check
    
    - name: Run clippy on agent
      working-directory: ./agent
      run: cargo clippy -- -D warnings
    
    - name: Run clippy on CLI
      working-directory: ./cli
      run: cargo clippy -- -D warnings
